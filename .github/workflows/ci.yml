name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: phone-app/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install phone dependencies
        working-directory: phone-app
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop-server
        run: python -m pip install -r requirements.txt

      - name: Typecheck phone app
        working-directory: phone-app
        run: npm run typecheck

      - name: Run phone logic tests
        working-directory: phone-app
        run: npm run test:logic

      - name: Run desktop tests
        working-directory: desktop-server
        run: python -m unittest discover -s tests
